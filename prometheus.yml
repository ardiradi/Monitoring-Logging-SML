# Prometheus Configuration (Docker Desktop Windows version)
# prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ML Model Metrics Exporter (host machine)
  - job_name: 'ml_model_exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: '/metrics'

  # ML Model API FastAPI (host machine)
  - job_name: 'ml_model_api'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
